ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'

    // ---- SYSTEMA native music library (Phase 1) ----
    kotlinVersion = '2.1.0'
    kspVersion = '2.1.0-1.0.29'
    roomVersion = '2.7.1'
    coroutinesVersion = '1.9.0'

    // ---- SYSTEMA on-device audio DSP (Phase 13) ----
    // WorkManager runs the analysis batches off the main thread with
    // cancellation and battery constraints. 2.9.1 is the last release
    // on the 2.9.x line, which targets the same AndroidX baseline the
    // rest of the project already uses.
    workVersion = '2.9.1'

    // ---- SYSTEMA native audio engine (Phase 2) ----
    // 1.10.1 is the newest stable line built against Kotlin 2.1.x.
    // 1.11.0 moved to Kotlin 2.2.0 and would force a toolchain bump.
    media3Version = '1.10.1'
}