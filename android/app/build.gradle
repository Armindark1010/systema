apply plugin: 'com.android.application'
// SYSTEMA native music library (Phase 1): Kotlin sources + Room codegen.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.devtools.ksp'

android {
    namespace = "com.systema.music"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.systema.music"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Matches the Java level Capacitor generates in capacitor.build.gradle.
    kotlinOptions {
        jvmTarget = '21'
    }
}

// Room schema export. Keeping the generated JSON under version control
// makes future migrations verifiable instead of guesswork.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.incremental', 'true')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"

    // ---- SYSTEMA native music library (Phase 1) ----
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"
    // ---- SYSTEMA native audio engine (Phase 2) ----
    // exoplayer + the default extractors/renderers it needs for local
    // audio. No DASH/HLS/IMA: nothing here streams from the network.
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-common:$media3Version"
    // ---- SYSTEMA background playback (Phase 3) ----
    // MediaSession + MediaSessionService: the foreground playback
    // service, the media notification, lock-screen controls and media
    // button handling all come from this one artifact. Pinned to the
    // same media3Version as the engine so no second Media3 line can be
    // pulled into the graph.
    implementation "androidx.media3:media3-session:$media3Version"
    // ---- SYSTEMA on-device audio DSP (Phase 13) ----
    // WorkManager only. The DSP itself (FFT, onset detection, tempo)
    // is implemented in-project: no DSP framework, no ML runtime, no
    // native library is pulled in for it.
    implementation "androidx.work:work-runtime-ktx:$workVersion"
    // ---- SYSTEMA ONNX inference runtime (Phase 15) ----
    // Confined to com.systema.music.inference.OnnxInferenceRuntime.
    // No other file in the project may import ai.onnxruntime.*, so the
    // runtime can be swapped without touching the plugin, the
    // TypeScript services or the UI. A unit test enforces that.
    implementation "com.microsoft.onnxruntime:onnxruntime-android:$onnxRuntimeVersion"

    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
